name: t2-apply

on:
  push:
    branches:
      - gnu-parity-t2-command-semantics

permissions:
  contents: write

jobs:
  apply:
    if: ${{ !contains(github.event.head_commit.message, '[t2-applied]') }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: gnu-parity-t2-command-semantics
          fetch-depth: 0
      - name: Apply GNU grep T2 command-semantics changes
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path

          def replace_once(text, old, new, label):
              count = text.count(old)
              if count != 1:
                  raise SystemExit(f"{label}: expected one match, found {count}")
              return text.replace(old, new, 1)

          path = Path('src/Command.cs')
          text = path.read_text(encoding='utf-8')
          text = replace_once(
              text,
              'private const string VersionText = "grep (Icod.Grep) 1.0";',
              'private const string VersionText = "grep (Icod.Grep) 1.1.0";',
              'version text'
          )
          text = replace_once(
              text,
              '\t\tpublic DeviceMode DeviceMode { get; set; } = DeviceMode.Read;\n',
              '\t\tpublic DeviceMode DeviceMode { get; set; } = DeviceMode.Read;\n\t\tpublic bool DeviceModeExplicit { get; set; }\n',
              'device explicit property'
          )
          text = replace_once(
              text,
              '\t\tvar settings = new OptionParserSettings {\n\t\t\tAllowLongOptionAbbreviations = true,\n\t\t\tOrdering = OptionOrdering.Permute\n\t\t};',
              '\t\tvar settings = new OptionParserSettings {\n\t\t\tAllowLongOptionAbbreviations = true,\n\t\t\tOrdering = Environment.GetEnvironmentVariable( "POSIXLY_CORRECT" ) is null\n\t\t\t\t? OptionOrdering.Permute\n\t\t\t\t: OptionOrdering.RequireOrder\n\t\t};',
              'parser ordering'
          )
          text = replace_once(
              text,
              '\t\t\t\t\toptions.DeviceMode = deviceMode;\n\t\t\t\t\tbreak;',
              '\t\t\t\t\toptions.DeviceMode = deviceMode;\n\t\t\t\t\toptions.DeviceModeExplicit = true;\n\t\t\t\t\tbreak;',
              'explicit device option'
          )
          text = replace_once(
              text,
              '\t\tif ( options.OnlyMatching ) {\n\t\t\toptions.BeforeContext = 0;\n\t\t\toptions.AfterContext = 0;\n\t\t}',
              '\t\tif ( options.OnlyMatching && options.ContextRequested ) {\n\t\t\tawait context.Diagnostics.WarningAsync(\n\t\t\t\t"context options have no effect with --only-matching",\n\t\t\t\tcontext.CancellationToken\n\t\t\t).ConfigureAwait( false );\n\t\t\toptions.BeforeContext = 0;\n\t\t\toptions.AfterContext = 0;\n\t\t\toptions.ContextRequested = false;\n\t\t}',
              'only matching context'
          )
          text = replace_once(
              text,
              '\t\t\t\t\tif ( options.DeviceMode == DeviceMode.Skip && item.Entry.Kind == FileSystemEntryKind.Other ) {\n\t\t\t\t\t\tbreak;\n\t\t\t\t\t}',
              '\t\t\t\t\tif ( item.Entry.Kind == FileSystemEntryKind.Other && ShouldSkipRecursiveDevice( options ) ) {\n\t\t\t\t\t\tbreak;\n\t\t\t\t\t}',
              'recursive device policy'
          )
          anchor = '\tprivate static async ValueTask<bool> ShouldSkipDeviceAsync(\n'
          helper = '''\tprivate static bool ShouldSkipRecursiveDevice( GrepOptions options ) {\n\t\tif ( options.DeviceModeExplicit ) {\n\t\t\treturn options.DeviceMode == DeviceMode.Skip;\n\t\t}\n\t\treturn options.SymbolicLinkMode != SymbolicLinkTraversalMode.Always;\n\t}\n\n'''
          text = replace_once(text, anchor, helper + anchor, 'recursive device helper')
          path.write_text(text, encoding='utf-8', newline='\n')

          path = Path('tests/Grep.Tests/src/CommandTests.cs')
          text = path.read_text(encoding='utf-8')
          text = replace_once(
              text,
              'using System.Text;\n',
              'using System.Net.Sockets;\nusing System.Text;\n',
              'socket using'
          )
          marker = '''\t/// <summary>Verifies multiple expression and pattern-file sources are combined in encounter order.</summary>\n'''
          test = '''\t/// <summary>Verifies POSIXLY_CORRECT stops option parsing at the first operand.</summary>\n\t/// <returns>A task representing the test.</returns>\n\t[Fact]\n\tpublic async Task PosixlyCorrectRequiresOptionsBeforeOperands() {\n\t\tvar previous = Environment.GetEnvironmentVariable( "POSIXLY_CORRECT" );\n\t\ttry {\n\t\t\tEnvironment.SetEnvironmentVariable( "POSIXLY_CORRECT", null );\n\t\t\tvar gnu = await RunAsync( [ "hit", "-n" ], "hit\\n"u8.ToArray() );\n\t\t\tAssert.Equal( CommandExitCodes.Success, gnu.Status );\n\t\t\tAssert.Equal( "1:hit\\n"u8.ToArray(), gnu.Output );\n\n\t\t\tEnvironment.SetEnvironmentVariable( "POSIXLY_CORRECT", "1" );\n\t\t\tvar posix = await RunAsync( [ "hit", "-n" ], "hit\\n"u8.ToArray() );\n\t\t\tAssert.Equal( CommandExitCodes.UsageError, posix.Status );\n\t\t\tAssert.Contains( "-n", posix.Error );\n\t\t} finally {\n\t\t\tEnvironment.SetEnvironmentVariable( "POSIXLY_CORRECT", previous );\n\t\t}\n\t}\n\n'''
          text = replace_once(text, marker, test + marker, 'POSIXLY_CORRECT test')

          old = '''\t\t\tAssert.Equal(\n\t\t\t\tstring.Concat( first, ":hit\\n--\\n", second, ":hit\\n" ),\n\t\t\t\tEncoding.UTF8.GetString( onlyMatching.Output )\n\t\t\t);'''
          new = '''\t\t\tAssert.Equal(\n\t\t\t\tstring.Concat( first, ":hit\\n", second, ":hit\\n" ),\n\t\t\t\tEncoding.UTF8.GetString( onlyMatching.Output )\n\t\t\t);\n\t\t\tAssert.Contains( "warning", onlyMatching.Error, StringComparison.OrdinalIgnoreCase );\n\t\t\tAssert.Contains( "only-matching", onlyMatching.Error, StringComparison.OrdinalIgnoreCase );'''
          text = replace_once(text, old, new, 'only matching context expectation')

          marker = '''\t/// <summary>Verifies ordered include and exclude rules apply to command-line file operands by pathname suffix.</summary>\n'''
          test = '''\t/// <summary>Verifies recursive -r skips discovered special files by default while -D read overrides that policy.</summary>\n\t/// <returns>A task representing the test.</returns>\n\t[Fact]\n\tpublic async Task RecursiveDeviceDefaultsMatchGnuPolicy() {\n\t\tif ( OperatingSystem.IsWindows() ) {\n\t\t\treturn;\n\t\t}\n\n\t\tvar directory = CreateTemporaryDirectory();\n\t\ttry {\n\t\t\tvar regular = System.IO.Path.Combine( directory, "regular.txt" );\n\t\t\tvar socketPath = System.IO.Path.Combine( directory, "probe.sock" );\n\t\t\tawait File.WriteAllTextAsync( regular, "hit\\n" );\n\t\t\tusing var socket = new Socket( AddressFamily.Unix, SocketType.Stream, ProtocolType.Unspecified );\n\t\t\tsocket.Bind( new UnixDomainSocketEndPoint( socketPath ) );\n\t\t\tsocket.Listen();\n\n\t\t\tvar defaultResult = await RunAsync( [ "-r", "hit", directory ], [] );\n\t\t\tAssert.Equal( CommandExitCodes.Success, defaultResult.Status );\n\t\t\tAssert.Contains( "regular.txt", Encoding.UTF8.GetString( defaultResult.Output ) );\n\t\t\tAssert.Empty( defaultResult.Error );\n\n\t\t\tvar explicitRead = await RunAsync( [ "-r", "-D", "read", "hit", directory ], [] );\n\t\t\tAssert.Equal( CommandExitCodes.UsageError, explicitRead.Status );\n\t\t\tAssert.NotEmpty( explicitRead.Error );\n\t\t} finally {\n\t\t\tDirectory.Delete( directory, recursive: true );\n\t\t}\n\t}\n\n'''
          text = replace_once(text, marker, test + marker, 'recursive device test')
          text = replace_once(
              text,
              'Assert.Contains( "grep (Icod.Grep)", version.TextOutput );',
              'Assert.Contains( "grep (Icod.Grep) 1.1.0", version.TextOutput );',
              'version assertion'
          )
          path.write_text(text, encoding='utf-8', newline='\n')

          path = Path('Icod.Grep.csproj')
          text = path.read_text(encoding='utf-8')
          text = text.replace('<Version>1.0.1</Version>', '<Version>1.1.0</Version>')
          text = text.replace('<AssemblyVersion>1.0.1.0</AssemblyVersion>', '<AssemblyVersion>1.1.0.0</AssemblyVersion>')
          text = text.replace('<PackageVersion>1.0.1</PackageVersion>', '<PackageVersion>1.1.0</PackageVersion>')
          text = replace_once(
              text,
              '<PackageReleaseNotes>Updates Icod.CommandFramework to 2.1.0, adds the NuGet package icon, standardizes CI/CD, and records the GNU grep 3.12 feature-completeness audit.</PackageReleaseNotes>',
              '<PackageReleaseNotes>Improves GNU grep 3.12 compatibility: honors POSIXLY_CORRECT option ordering, applies GNU recursive device defaults with -D overrides, and warns/disables context behavior with --only-matching.</PackageReleaseNotes>',
              'package notes'
          )
          path.write_text(text, encoding='utf-8', newline='\n')

          for name in ['README.md', 'packaging/README.md']:
              path = Path(name)
              text = path.read_text(encoding='utf-8')
              text = text.replace('1.0.1', '1.1.0')
              path.write_text(text, encoding='utf-8', newline='\n')

          path = Path('Icod.Grep-GNU-grep-3.12-Feature-Completeness-Audit.md')
          text = path.read_text(encoding='utf-8')
          text = text.replace('**Audit release:** `1.0.1`', '**Audit release:** `1.0.1`  \n**Current parity release:** `1.1.0` — T2 command semantics closes G04, G05, and G06')
          text = text.replace('4. `POSIXLY_CORRECT` option-order behavior is not implemented.', '4. ✅ `POSIXLY_CORRECT` option-order behavior is implemented in `1.1.0`.')
          text = text.replace('5. Default device handling under `-r` differs from GNU grep.', '5. ✅ Default device handling under `-r` is aligned with GNU grep in `1.1.0`.')
          text = text.replace('6. `-o` combined with context options does not yet follow GNU\'s warning/no-effect contract exactly.', '6. ✅ `-o` combined with context options follows GNU\'s warning/no-effect contract in `1.1.0`.')
          text = text.replace('The first six items are concrete implementation gaps. Items 7–10 are compatibility boundaries or parity risks that should be closed with targeted tests and, where necessary, implementation work.', 'Items 1–3 remain concrete implementation gaps. Items 4–6 are closed by the `1.1.0` T2 command-semantics tranche. Items 7–10 remain compatibility boundaries or parity risks that should be closed with targeted tests and, where necessary, implementation work.')
          text = text.replace('**Status:** Missing\n\nThe parser currently always uses GNU operand permutation.', '**Status:** Closed in `1.1.0`\n\nThe parser now selects POSIX required ordering when `POSIXLY_CORRECT` is present and GNU operand permutation otherwise.')
          text = text.replace('**Status:** Behavioral mismatch\n\nGNU grep defaults to reading devices/FIFOs/sockets when they are command-line operands or when `-R` is used, but defaults to skipping them when they are encountered recursively under `-r`. The current `DeviceMode` default is `Read`; recursive traversal skips `FileSystemEntryKind.Other` only when `--devices=skip` was explicitly selected.', '**Status:** Closed in `1.1.0`\n\nRecursive `-r` / `-d recurse` now skips discovered special files by default, while direct operands and `-R` retain read-by-default behavior. An explicit `-D read|skip` overrides the default policy.')
          text = text.replace('**Status:** Partial mismatch\n\nGNU grep specifies that `-A`, `-B`, and `-C` have no effect with `-o` and that a warning is emitted. `Icod.Grep` zeroes the context counts but leaves the internal `ContextRequested` flag set. That can still cause group separators between output from separate files, and no GNU-compatible warning is emitted.', '**Status:** Closed in `1.1.0`\n\nWhen context is requested with `-o`, `Icod.Grep` now emits a warning, clears context state completely, and suppresses context-group separators.')
          text = text.replace('### T2 — Command semantics\n\nAddress G04, G05, and G06. These are self-contained grep command behaviors with comparatively low architectural risk.', '### T2 — Command semantics — complete in `1.1.0`\n\nG04, G05, and G06 are closed with targeted regression tests.')
          text = text.replace('Version `1.0.1` is appropriate as a maintenance release for the current repository changes:', 'Version `1.0.1` was the maintenance release that established this audit. Version `1.1.0` is the first parity release and closes G04, G05, and G06. The original `1.0.1` assessment was:')
          path.write_text(text, encoding='utf-8', newline='\n')
          PY

          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git rm .github/workflows/t2-apply.yaml
          git add src/Command.cs tests/Grep.Tests/src/CommandTests.cs Icod.Grep.csproj README.md packaging/README.md Icod.Grep-GNU-grep-3.12-Feature-Completeness-Audit.md
          git diff --check
          git commit -m "Implement GNU grep T2 command semantics [t2-applied]"
          git push origin HEAD:gnu-parity-t2-command-semantics
