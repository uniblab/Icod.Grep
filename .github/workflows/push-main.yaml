name: build and test

on:
  push:
    branches:
      - main

permissions:
  contents: read

jobs:
  # ----------------------------------------------------
  # STAGE 1: Cross-Platform Build & Test (All 3 OSs)
  # ----------------------------------------------------
  build-and-test:
    strategy:
      matrix:
        os: [windows-latest, ubuntu-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 10.0.x

      - run: dotnet clean Icod.UtilLinux.sln -c Release
      - run: dotnet restore Icod.UtilLinux.sln
      - run: dotnet build Icod.UtilLinux.sln -c Release --no-restore -p:ContinuousIntegrationBuild=true
      - run: dotnet test Icod.UtilLinux.sln -c Release --no-build --logger trx
