name: release

on:
  push:
    tags:
      - 'v*'

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: false

permissions:
  contents: read

env:
  DOTNET_VERSION: 10.0.x
  CONFIGURATION: Release

jobs:
  metadata:
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.version.outputs.version }}
      prerelease: ${{ steps.version.outputs.prerelease }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: ${{ env.DOTNET_VERSION }}
      - name: Require tagged commit on main
        shell: pwsh
        run: |
          git fetch origin main --no-tags
          git merge-base --is-ancestor $env:GITHUB_SHA origin/main
          if (0 -ne $LASTEXITCODE) {
              throw "Release tag '$env:GITHUB_REF_NAME' does not point to a commit contained in main."
          }
      - id: version
        name: Validate tag and package version
        shell: pwsh
        run: |
          if ($env:GITHUB_REF_NAME -notmatch '^v(?<version>[0-9]+\.[0-9]+\.[0-9]+(?:-[0-9A-Za-z][0-9A-Za-z.-]*)?)$') {
              throw "Release tag '$env:GITHUB_REF_NAME' is not a supported v<semver> tag."
          }
          $version = $Matches.version
          $projectVersion = (dotnet msbuild Icod.Grep.csproj -nologo -getProperty:Version).Trim()
          if (0 -ne $LASTEXITCODE) { throw 'Unable to read Version from Icod.Grep.csproj.' }
          $packageVersion = (dotnet msbuild Icod.Grep.csproj -nologo -getProperty:PackageVersion).Trim()
          if (0 -ne $LASTEXITCODE) { throw 'Unable to read PackageVersion from Icod.Grep.csproj.' }
          if ($projectVersion -ne $packageVersion) {
              throw "Version '$projectVersion' does not match PackageVersion '$packageVersion'."
          }
          if ($version -ne $packageVersion) {
              throw "Tag version '$version' does not match PackageVersion '$packageVersion'."
          }
          "version=$version" >> $env:GITHUB_OUTPUT
          "prerelease=$($version.Contains('-').ToString().ToLowerInvariant())" >> $env:GITHUB_OUTPUT

  package:
    needs: metadata
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: ${{ env.DOTNET_VERSION }}
      - name: Restore
        run: dotnet restore Icod.Grep.sln
      - name: Build Release package inputs
        run: dotnet build Icod.Grep.sln -c ${{ env.CONFIGURATION }} --no-restore -p:ContinuousIntegrationBuild=true
      - name: Test Release package inputs
        run: dotnet test Icod.Grep.sln -c ${{ env.CONFIGURATION }} --no-build --no-restore --logger trx
      - name: Pack exact Release tool package
        run: dotnet pack Icod.Grep.csproj -c ${{ env.CONFIGURATION }} --no-build --no-restore -o artifacts/release -p:ContinuousIntegrationBuild=true
      - name: Verify exact Release package artifact
        shell: pwsh
        run: ./packaging/VerifyPackageArtifact.ps1 -ArtifactDirectory artifacts/release -Configuration '${{ env.CONFIGURATION }}' -ExpectedVersion '${{ needs.metadata.outputs.version }}'
      - name: Upload Release package
        uses: actions/upload-artifact@v4
        with:
          name: release-package
          path: artifacts/release/Icod.Grep.${{ needs.metadata.outputs.version }}.nupkg
          if-no-files-found: error
          retention-days: 7

  package-smoke:
    needs: [metadata, package]
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: windows-latest
            name: Windows
          - os: ubuntu-latest
            name: Linux
          - os: macos-latest
            name: macOS
    name: Package smoke - ${{ matrix.name }}
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: release-package
          path: artifacts/package
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: ${{ env.DOTNET_VERSION }}
      - name: Install and exercise Release package
        shell: pwsh
        run: |
          $source = [System.IO.Path]::GetFullPath('artifacts/package')
          $toolPath = [System.IO.Path]::GetFullPath('artifacts/tool')
          dotnet tool install Icod.Grep --tool-path $toolPath --add-source $source --version '${{ needs.metadata.outputs.version }}' --ignore-failed-sources
          if (0 -ne $LASTEXITCODE) { throw 'Release package installation failed.' }
          $grep = if ([System.Environment]::OSVersion.Platform -eq [System.PlatformID]::Win32NT) { Join-Path $toolPath 'grep.exe' } else { Join-Path $toolPath 'grep' }
          & $grep --version
          if (0 -ne $LASTEXITCODE) { throw 'Release grep --version failed.' }
          [System.IO.File]::WriteAllText('sample.txt', "alpha`nbeta`ngamma`n", [System.Text.UTF8Encoding]::new($false))
          & $grep -n beta sample.txt
          if (0 -ne $LASTEXITCODE) { throw 'Release grep functional smoke failed.' }

  archives:
    needs: metadata
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: windows-latest
            rid: win-x64
          - os: windows-11-arm
            rid: win-arm64
          - os: ubuntu-24.04
            rid: linux-x64
          - os: ubuntu-24.04-arm
            rid: linux-arm64
          - os: macos-15-intel
            rid: osx-x64
          - os: macos-15
            rid: osx-arm64
    name: ${{ matrix.rid }}
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: ${{ env.DOTNET_VERSION }}
      - name: Build and smoke release archive
        shell: pwsh
        run: >-
          ./packaging/BuildReleaseArchive.ps1
          -Configuration '${{ env.CONFIGURATION }}'
          -RuntimeIdentifier '${{ matrix.rid }}'
          -Version '${{ needs.metadata.outputs.version }}'
      - name: Upload release archive
        uses: actions/upload-artifact@v4
        with:
          name: release-${{ matrix.rid }}
          path: artifacts/release/Icod.Grep-${{ needs.metadata.outputs.version }}-${{ matrix.rid }}.zip
          if-no-files-found: error
          retention-days: 7

  publish-nuget:
    needs: [metadata, package, package-smoke]
    runs-on: ubuntu-latest
    environment: Release
    permissions:
      contents: read
      id-token: write
    steps:
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: ${{ env.DOTNET_VERSION }}
      - uses: actions/download-artifact@v4
        with:
          name: release-package
          path: artifacts/package
      - id: nuget-login
        uses: NuGet/login@v1
        with:
          user: ${{ secrets.NUGET_USER }}
      - name: Publish to NuGet.org
        shell: pwsh
        env:
          NUGET_API_KEY: ${{ steps.nuget-login.outputs.NUGET_API_KEY }}
        run: |
          $package = 'artifacts/package/Icod.Grep.${{ needs.metadata.outputs.version }}.nupkg'
          dotnet nuget push $package --api-key $env:NUGET_API_KEY --source https://api.nuget.org/v3/index.json --skip-duplicate
          if (0 -ne $LASTEXITCODE) { throw 'NuGet.org publication failed.' }

  publish-github-packages:
    needs: [metadata, package, package-smoke]
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: ${{ env.DOTNET_VERSION }}
      - uses: actions/download-artifact@v4
        with:
          name: release-package
          path: artifacts/package
      - name: Publish to GitHub Packages
        shell: pwsh
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          $package = 'artifacts/package/Icod.Grep.${{ needs.metadata.outputs.version }}.nupkg'
          dotnet nuget push $package --source https://nuget.pkg.github.com/${{ github.repository_owner }}/index.json --api-key $env:GITHUB_TOKEN --skip-duplicate
          if (0 -ne $LASTEXITCODE) { throw 'GitHub Packages publication failed.' }

  github-release:
    needs: [metadata, package, package-smoke, archives, publish-nuget, publish-github-packages]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          pattern: release-*
          path: artifacts/release-assets
          merge-multiple: true
      - name: Create checksums
        shell: pwsh
        run: |
          $assetDirectory = 'artifacts/release-assets'
          $files = @(Get-ChildItem -LiteralPath $assetDirectory -File | Where-Object { $_.Extension -in @('.zip', '.nupkg') } | Sort-Object Name)
          if (7 -ne $files.Count) { throw "Expected seven release binaries before checksumming; found $($files.Count)." }
          $lines = foreach ($file in $files) {
              $hash = (Get-FileHash -LiteralPath $file.FullName -Algorithm SHA256).Hash.ToLowerInvariant()
              "$hash  $($file.Name)"
          }
          [System.IO.File]::WriteAllLines((Join-Path $assetDirectory 'SHA256SUMS.txt'), $lines, [System.Text.UTF8Encoding]::new($false))
      - name: Create GitHub Release
        shell: pwsh
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GH_REPO: ${{ github.repository }}
        run: |
          $version = '${{ needs.metadata.outputs.version }}'
          $assetDirectory = [System.IO.Path]::GetFullPath('artifacts/release-assets')
          $assets = @(Get-ChildItem -LiteralPath $assetDirectory -File | Sort-Object Name | ForEach-Object { $_.FullName })
          if (8 -ne $assets.Count) { throw "Expected eight GitHub Release assets; found $($assets.Count)." }
          $arguments = @('release','create',$env:GITHUB_REF_NAME,'--verify-tag','--title',"Icod.Grep $version",'--generate-notes')
          if ('true' -eq '${{ needs.metadata.outputs.prerelease }}') {
              $arguments += '--prerelease'
              $arguments += '--latest=false'
          }
          $arguments += $assets
          & gh @arguments
          if (0 -ne $LASTEXITCODE) { throw 'GitHub Release creation failed.' }
