name: t2-fix

on:
  push:
    branches:
      - gnu-parity-t2-command-semantics

permissions:
  contents: write

jobs:
  apply:
    if: ${{ !contains(github.event.head_commit.message, '[t2-special-kinds]') }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: gnu-parity-t2-command-semantics
          fetch-depth: 0
      - name: Correct recursive special-file classification
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path
          p = Path('src/Command.cs')
          s = p.read_text(encoding='utf-8')
          old = 'if ( item.Entry.Kind == FileSystemEntryKind.Other && ShouldSkipRecursiveDevice( options ) ) {'
          new = 'if ( IsDeviceEntryKind( item.Entry.Kind ) && ShouldSkipRecursiveDevice( options ) ) {'
          if s.count(old) != 1:
              raise SystemExit(f'expected one recursive kind check, found {s.count(old)}')
          s = s.replace(old, new, 1)
          anchor = '\tprivate static bool ShouldSkipRecursiveDevice( GrepOptions options ) {\n'
          helper = '''\tprivate static bool IsDeviceEntryKind( FileSystemEntryKind kind ) => kind is\n\t\tFileSystemEntryKind.Other\n\t\tor FileSystemEntryKind.BlockDevice\n\t\tor FileSystemEntryKind.CharacterDevice\n\t\tor FileSystemEntryKind.Fifo\n\t\tor FileSystemEntryKind.Socket;\n\n'''
          if s.count(anchor) != 1:
              raise SystemExit(f'expected one helper anchor, found {s.count(anchor)}')
          s = s.replace(anchor, helper + anchor, 1)
          p.write_text(s, encoding='utf-8', newline='\n')
          PY
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git rm .github/workflows/t2-fix.yaml
          git add src/Command.cs
          git diff --check
          git commit -m "Recognize all recursive device entry kinds [t2-special-kinds]"
          git push origin HEAD:gnu-parity-t2-command-semantics
